name: bugtracker-dev

services:
  db:
    image: postgres:18.7-alpine

    environment:
      POSTGRES_DB: bugtracker_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:55432:5432"

    volumes:
      - database:/var/lib/postgresql

volumes:
  database: